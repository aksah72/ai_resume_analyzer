name: AI Resume Analyzer CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Build React app
        env:
          REACT_APP_UPLOAD_URL: http://${{ secrets.EC2_HOST }}:5001
          REACT_APP_AI_URL: http://${{ secrets.EC2_HOST }}:5002
        run: |
          cd frontend
          npm run build

      - name: Copy build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/build/"
          target: "/home/ubuntu/ai_resume_analyzer/frontend/"
          strip_components: 1

      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/ai_resume_analyzer/upload-service && npm install
            cd ~/ai_resume_analyzer/ai-service && npm install
            pm2 restart all