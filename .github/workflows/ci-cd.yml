name: AI Resume Analyzer CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. Install dependencies (on GitHub runner)
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      # 4. Build React app (on GitHub runner - FAST)
      - name: Build React app
        run: |
          cd frontend
          npm run build

      # 5. Copy build folder to EC2
      - name: Copy build to EC2
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          source: "frontend/build/"
          target: "~/ai_resume_analyzer/frontend/"
          strip_components: 2

      # 6. SSH into EC2 - restart services only (NO build)
      - name: Deploy & restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            set -e
            cd ~/ai_resume_analyzer

            # Pull latest backend/ai-service code
            git fetch origin
            git reset --hard origin/main

            # — AI Service ————————————————————————
            cd ai-service
            npm install --production
            pm2 describe ai-service > /dev/null 2>&1 \
              && pm2 restart ai-service \
              || pm2 start server.js --name ai-service

            # — Persist pm2 across reboots ————————
            pm2 save

            echo "✅ Deployment complete"