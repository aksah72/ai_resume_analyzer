name: AI Resume Analyzer CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ── Job 1: Test & Lint ─────────────────────────────────────────
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install upload-service dependencies
        working-directory: upload-service
        run: npm install

      - name: Install ai-service dependencies
        working-directory: ai-service
        run: npm install

  # ── Job 2: Deploy to EC2 (only on push to main) ───────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: test           # only runs if tests pass
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.EC2_HOST }}
    username: ${{ secrets.EC2_USER }}
    key: ${{ secrets.EC2_KEY }}

    timeout: 30m
    command_timeout: 30m

    script: |
      set -e

      cd ~/ai_resume_analyzer
      git fetch origin
      git reset --hard origin/main

      cd frontend
      npm install
      rm -rf build
      npm run build

      pm2 describe frontend > /dev/null 2>&1 \
        && pm2 restart frontend \
        || pm2 start "npx serve -s build -l 3000" --name frontend

      cd ../upload-service
      npm install
      pm2 describe upload-service > /dev/null 2>&1 \
        && pm2 restart upload-service \
        || pm2 start server.js --name upload-service

      cd ../ai-service
      npm install
      pm2 describe ai-service > /dev/null 2>&1 \
        && pm2 restart ai-service \
        || pm2 start server.js --name ai-service

      pm2 save

      echo "Deployment complete"
